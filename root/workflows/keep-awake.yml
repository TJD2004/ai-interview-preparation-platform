name: Keep backend awake
 
on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes, UTC
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://ai-interview-preparation-platform-1-pn1s.onrender.com/api/health || exit 1
 